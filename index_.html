<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techfest Tasks</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 50px;
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .1);
            padding: 35px;
            border-radius: 20px;
            transition: .35s;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, .4);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin-bottom: 15px;
        }

        .card p {
            font-size: .95rem;
            margin-bottom: 30px;
            color: #d1d5db;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: #06b6d4;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: .3s;
        }

        .btn:hover {
            background: #0891b2;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>🚀 Techfest Project Showcase</h1>

        <p>Select a task to explore.</p>

        <div class="grid">

            <div class="card">
                <div class="icon">🤖</div>
                <h2>Task 1</h2>
                <p>Cyborg Themed Landing Page</p>

                <a class="btn" href="Task/Task1-Cyborg-Themed Landing Page/index.html">
                    Open Task
                </a>
            </div>

            <div class="card">
                <div class="icon">📄</div>
                <h2>Task 2</h2>
                <p>Your Second Assignment</p>

                <a class="btn" href="Task/Task2-/index.html">
                    Open Task
                </a>
            </div>

            <div class="card">
                <div class="icon">➕</div>
                <h2>More Tasks</h2>
                <p>Add upcoming assignments here.</p>

                <a class="btn" href="#">
                    Coming Soon
                </a>
            </div>

        </div>

    </div>

</body>

</html>
